[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotlight"
version = "0.1.0"
description = "A local content assistant for video transcription."
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper",
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12; sys_platform == 'win32'",
    "PySide6",
]

[project.scripts]
spotlight = "spotlight.__main__:main"

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spotlight"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
